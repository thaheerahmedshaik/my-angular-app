<table class="table table-hover">
  <thead class="table-dark">
    <tr>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Email</th>
      <th>Sales Volume</th>
      <th>Meet Quota</th>
    </tr>
  </thead>
  <tbody>
    @for (person of salesPersonlist; track person) {
      <tr>
        <td>{{ person.firstName }}</td>
        <td>{{ person.lastName }}</td>
        <td>{{ person.email }}</td>
      
        <td>{{ person.salesVolume | currency:'EUR' }}</td>
        <td>
          @if (person.salesVolume >= 160000) {
            <div>Yes</div>
          } @else {
            <div>NO</div>
          }
        </td>
      </tr>
    }
  </tbody>
</table>
