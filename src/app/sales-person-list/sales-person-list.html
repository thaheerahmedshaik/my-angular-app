<table>
  <thead>
    <tr>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Email</th>
      <th>Sales Volume</th>
    </tr>
  </thead>
  <tbody>
    @for (person of salesPersonlist; track person.email) {
      <tr>
        <td>{{ person.firstName }}</td>
        <td>{{ person.lastName }}</td>
        <td>{{ person.email }}</td>
       <td>{{ person.salesVolume | currency:'INR':'symbol':'1.2-2':'en-IN' }}</td>
      </tr>
    }
  </tbody>
</table>
